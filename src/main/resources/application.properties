spring.application.name=nhom1_java_naitei_26

spring.datasource.url=jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres
spring.datasource.username=postgres.bqorduhypfliosbzegep
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# CẤU HÌNH JWT (TASK #99060 & #99062)
# ==========================================
app.jwt.secret=${JWT_SECRET:798d72e412dcee65856dd610b4165ac806bfa4f0207bcf0fa8fe162d323c1a5c}
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# ==========================================
# CẤU HÌNH GOOGLE OAUTH2 CLIENT (TASK #99064)
# ==========================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-google-client-id.apps.googleusercontent.com}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# ==========================================
# CẤU HÌNH FACEBOOK OAUTH2 CLIENT (TASK #99065)
# ==========================================
spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID:your-facebook-client-id}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET:your-facebook-client-secret}
spring.security.oauth2.client.registration.facebook.scope=email,public_profile

# ==========================================
# CẤU HÌNH LINK CHIA SẺ MẠNG XÃ HỘI (TASK #99083)
# Địa chỉ web React dùng để ghép link trang chi tiết sản phẩm khi chia sẻ
# ==========================================
app.frontend.url=${FRONTEND_URL:http://localhost:3000}
app.frontend.product-path=/san-pham

# ==========================================
# CẤU HÌNH SLACK INCOMING WEBHOOK (TASK #99079)
# Webhook URL là bí mật, chỉ đặt trong .env, không commit lên Git
# ==========================================
app.slack.webhook-url=${SLACK_WEBHOOK_URL:}

# ==========================================
# CẤU HÌNH EMAIL THÔNG BÁO ĐƠN HÀNG MỚI (TASK #NOTIFICATION-EMAIL)
# Tài khoản SMTP là bí mật, chỉ đặt trong .env, không commit lên Git
# ==========================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.notification.admin-email=${ADMIN_NOTIFICATION_EMAIL:}

# ==========================================
# CẤU HÌNH KÍCH THƯỚC REQUEST (CHO UPLOAD ẢNH BASE64)
# ==========================================
server.tomcat.max-http-form-content-size=10485760
server.tomcat.max-swallow-size=-1
server.tomcat.max-save-post-size=-1
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB